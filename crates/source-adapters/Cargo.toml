[package]
name = "improvement-engine-source-adapters"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[lib]
name = "improvement_engine_source_adapters"
path = "src/lib.rs"

[dependencies]
arrow-array = "57.0.0"
arrow-schema = "57.0.0"
parquet = { version = "57.0.0", features = ["arrow"] }
csv = "1.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
improvement-engine-core = { path = "../core" }

[dev-dependencies]
tempfile = "3.20.0"
