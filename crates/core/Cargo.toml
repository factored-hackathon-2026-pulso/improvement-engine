[package]
name = "improvement-engine-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[lib]
name = "improvement_engine_core"
path = "src/lib.rs"

[features]
default = []
test-support = []
local-simulation = []

[[test]]
name = "model_provider"
required-features = ["test-support"]

[[test]]
name = "model_attempt_repository"
required-features = ["test-support"]

[[test]]
name = "autonomous_scout"
required-features = ["test-support"]

[[test]]
name = "local_simulation"
required-features = ["local-simulation"]

[dependencies]
csv = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
