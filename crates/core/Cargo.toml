[package]
name = "improvement-engine-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[lib]
name = "improvement_engine_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
