name: rust-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The durable U02 seam is exercised against an ephemeral database owned by
  # this service's CI. Deployment infrastructure is intentionally not a test
  # dependency of the engine.
  postgres-artifact-migration:
    name: PostgreSQL artifact migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_DB: pulso_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pulso_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Run isolated immutable artifact migration test
        env:
          PULSO_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/pulso_test
          PULSO_ALLOW_DESTRUCTIVE_TEST_DB: "1"
        run: cargo +1.98.1 test --locked --workspace migration_enforces_cas_immutability_and_memory_tombstones -- --ignored
      - name: Run isolated U10 model-attempt migration test
        env:
          PULSO_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/pulso_test
          PULSO_ALLOW_DESTRUCTIVE_TEST_DB: "1"
        run: cargo +1.98.1 test --locked --workspace --features test-support migration_persists_model_attempt_cas_and_unknown_across_postgres_restart -- --ignored
      - name: Run isolated platform observation RLS and retention test
        env:
          PULSO_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/pulso_test
          PULSO_ALLOW_DESTRUCTIVE_TEST_DB: "1"
        run: cargo +1.98.1 test --locked -p improvement-engine-core --test postgres_platform_observations treated_batch_survives_reconnect_without_cross_tenant_read_or_double_insert -- --ignored
      - name: Run isolated U07 durable run-event ledger test
        env:
          PULSO_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/pulso_test
          PULSO_ALLOW_DESTRUCTIVE_TEST_DB: "1"
        run: cargo +1.98.1 test --locked -p improvement-engine-core --test postgres_run_events -- --ignored
      - name: Run isolated U24 V2 tenant-scoped sequence timeline test
        env:
          PULSO_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/pulso_test
          PULSO_ALLOW_DESTRUCTIVE_TEST_DB: "1"
        run: cargo +1.98.1 test --locked -p improvement-engine-core --lib run_timeline_v2::tests::authenticated_scope_sequence_pagination_and_sanitization_use_real_postgres -- --ignored
      - name: Run isolated P4 temporal memory receipt test
        env:
          PULSO_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/pulso_test
          PULSO_ALLOW_DESTRUCTIVE_TEST_DB: "1"
        run: cargo +1.98.1 test --locked -p improvement-engine-core --test postgres_memory_temporal_receipts -- --ignored --exact temporal_use_receipt_is_bound_to_event_scope_cutoff_and_current_head

  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.98.1 fmt --all --check
      - name: Lint
        run: cargo +1.98.1 clippy --workspace --all-targets -- -D warnings
      - name: Unit-test harness
        run: cargo +1.98.1 test --workspace --lib --features test-support
      - name: Integration tests
        run: cargo +1.98.1 test --workspace --features test-support
      - name: Contract-fixture harness
        run: python -m unittest discover -s tests -p "test_*_contract.py" -v
      - name: Validate contract fixtures
        run: python contracts/validate_fixtures.py
      - name: Verify Windows local E0 runner with pinned Pester
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $requiredPester = [version] '3.4.0'
          $availablePester = Get-Module -ListAvailable -Name Pester |
            Where-Object { $_.Version -eq $requiredPester } |
            Select-Object -First 1
          if ($null -eq $availablePester) {
            throw "Pester $requiredPester must be preinstalled on windows-latest; CI will not install or upgrade it."
          }
          Import-Module Pester -RequiredVersion $requiredPester -Force
          if ((Get-Module Pester).Version -ne $requiredPester) {
            throw "Loaded Pester version does not match required version $requiredPester."
          }
          Invoke-Pester -Path tests/run-local-ci.Tests.ps1 -EnableExit
          Invoke-Pester -Path tests/run-local-e0-e2e.Tests.ps1 -EnableExit
