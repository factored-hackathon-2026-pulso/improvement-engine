# GET routes and quotas (injectable clock: mock/a2 only, never wall time).
- {id: read-release, rule: reads, steps: [{method: GET, path: "/v1/registry/releases/{base_release}"}]}
- {id: read-release-unknown, rule: errors, steps: [{method: GET, path: /v1/registry/releases/rel-0000000000000000}]}
- {id: read-diff-same-release, rule: reads, steps: [{method: GET, path: "/v1/registry/releases/{base_release}/diff/{base_release}"}]}
- {id: read-diff-unknown, rule: errors, steps: [{method: GET, path: "/v1/registry/releases/{base_release}/diff/rel-0000000000000000"}]}
- {id: read-entity-with-version, rule: reads, steps: [{method: GET, path: "/v1/registry/entities/flow/disputa-cargo?version=1.0.0"}]}
- {id: read-entity-latest, rule: reads, steps: [{method: GET, path: /v1/registry/entities/flow/disputa-cargo}]}
- {id: read-entity-slash-id, rule: reads, steps: [{method: GET, path: "/v1/registry/entities/template/t/aclarar?version=1.0.0"}]}
- {id: read-entity-unknown-kind, rule: errors, steps: [{method: GET, path: /v1/registry/entities/gadget/x}]}
- {id: read-entity-unknown-id, rule: errors, steps: [{method: GET, path: /v1/registry/entities/flow/no-existe}]}
- {id: read-entity-unknown-version, rule: errors, steps: [{method: GET, path: "/v1/registry/entities/flow/disputa-cargo?version=9.9.9"}]}
- {id: read-lineage-unknown-run, rule: errors, steps: [{method: GET, path: /v1/registry/runs/run-0001/lineage}]}
- {id: read-lineage-needs-constructor, rule: roles, steps: [{method: GET, path: /v1/registry/runs/run-0001/lineage, as: approver_only}]}
- id: read-after-publish-release-and-diff
  rule: reads
  requires_sim: true
  steps:
    - {use: golden_published}
    - {method: GET, path: "/v1/registry/releases/{rel2}"}
    - {method: GET, path: "/v1/registry/releases/{base_release}/diff/{rel2}"}
    - {method: GET, path: "/v1/registry/entities/flow/disputa-cargo?version=1.1.0"}
- id: quota-auto-detect-proposals-10-then-11th
  rule: quotas
  requires_sim: true
  steps:
    - {method: POST, path: /v1/registry/proposals, repeat: 10, json: {agent_id: atencion, origin: auto_detect, title: "p{n}"}}
    - {method: POST, path: /v1/registry/proposals, json: {agent_id: atencion, origin: auto_detect, title: "p11"}}
- id: quota-window-is-rolling-24h
  rule: quotas
  requires_sim: true
  steps:
    - {method: POST, path: /v1/registry/proposals, repeat: 10, json: {agent_id: atencion, origin: auto_detect, title: "p{n}"}}
    - {sim: {advance: 86401}, method: POST, path: /v1/registry/proposals, json: {agent_id: atencion, origin: auto_detect, title: "later"}}
- id: quota-manual-proposals-are-not-limited
  rule: quotas
  requires_sim: true
  steps:
    - {method: POST, path: /v1/registry/proposals, repeat: 11, json: {agent_id: atencion, origin: manual, title: "m{n}"}}
- id: quota-evals-20-then-21st
  rule: quotas
  requires_sim: true
  steps:
    - {method: POST, path: /v1/registry/proposals, json: {agent_id: atencion, origin: auto_detect, title: golden}, save: {pid: proposal_id}}
    - {method: PUT, path: "/v1/registry/proposals/{pid}/draft", json: {$golden_draft: {expected_rev: 0}}}
    - {method: POST, path: "/v1/registry/proposals/{pid}/freeze"}
    - sim: {eval: [failed_infra, failed_infra, failed_infra, failed_infra, failed_infra, failed_infra, failed_infra, failed_infra, failed_infra, failed_infra, failed_infra, failed_infra, failed_infra, failed_infra, failed_infra, failed_infra, failed_infra, failed_infra, failed_infra, failed_infra, failed_infra]}
      method: POST
      path: /v1/registry/proposals/{pid}/evaluate
      repeat: 21
      json: {suite_id: disputas-suite}
- id: limit-flow-nodes-200-ok
  rule: limits
  steps:
    - {method: POST, path: /v1/registry/proposals, json: {agent_id: atencion, title: t}, save: {pid: proposal_id}}
    - {method: PUT, path: "/v1/registry/proposals/{pid}/draft", json: {$flow_nodes: {count: 200}}}
    - {method: POST, path: "/v1/registry/proposals/{pid}/validate", only_rules: [REG-LIMIT, REG-SCHEMA]}
- id: limit-flow-nodes-201-rejected
  rule: limits
  steps:
    - {method: POST, path: /v1/registry/proposals, json: {agent_id: atencion, title: t}, save: {pid: proposal_id}}
    - {method: PUT, path: "/v1/registry/proposals/{pid}/draft", json: {$flow_nodes: {count: 201}}}
    - {method: POST, path: "/v1/registry/proposals/{pid}/validate", only_rules: [REG-LIMIT, REG-SCHEMA]}
- id: limit-suite-scenarios-200-ok
  rule: limits
  steps:
    - {method: POST, path: /v1/registry/proposals, json: {agent_id: atencion, title: t}, save: {pid: proposal_id}}
    - {method: PUT, path: "/v1/registry/proposals/{pid}/draft", json: {$suite_scenarios: {count: 200}}}
    - {method: POST, path: "/v1/registry/proposals/{pid}/validate", only_rules: [REG-LIMIT, REG-SCHEMA]}
- id: limit-suite-scenarios-201-rejected
  rule: limits
  steps:
    - {method: POST, path: /v1/registry/proposals, json: {agent_id: atencion, title: t}, save: {pid: proposal_id}}
    - {method: PUT, path: "/v1/registry/proposals/{pid}/draft", json: {$suite_scenarios: {count: 201}}}
    - {method: POST, path: "/v1/registry/proposals/{pid}/validate", only_rules: [REG-LIMIT, REG-SCHEMA]}
# N-02 (agent-core 789d6c8): alias read route and per-entity versions route (pure reads: no proposal, no quota).
- {id: read-alias-staging, rule: reads, steps: [{method: GET, path: /v1/registry/aliases/atencion/staging}]}
- {id: read-alias-prod, rule: reads, steps: [{method: GET, path: /v1/registry/aliases/atencion/prod}]}
- {id: read-alias-unset-is-not-found, rule: errors, steps: [{method: GET, path: /v1/registry/aliases/atencion/canary}]}
- {id: read-alias-unknown-agent-is-not-found, rule: errors, steps: [{method: GET, path: /v1/registry/aliases/ghost/prod}]}
- {id: read-alias-without-bearer, rule: auth, steps: [{method: GET, path: /v1/registry/aliases/atencion/prod, as: none}]}
- id: read-alias-after-publish-and-revoke
  rule: reads
  requires_sim: true
  steps:
    - {use: golden_published}
    - {method: GET, path: /v1/registry/aliases/atencion/staging}
    - {method: GET, path: /v1/registry/aliases/atencion/prod}
    - {method: POST, path: "/v1/registry/releases/{rel2}/revoke", as: admin, json: {reason: x}}
    - {method: GET, path: /v1/registry/aliases/atencion/staging}
- {id: read-versions-flow, rule: reads, steps: [{method: GET, path: /v1/registry/versions/flow/disputa-cargo}]}
- {id: read-versions-slash-id, rule: reads, steps: [{method: GET, path: /v1/registry/versions/template/t/aclarar}]}
- {id: read-versions-unknown-id, rule: errors, steps: [{method: GET, path: /v1/registry/versions/flow/no-existe}]}
- {id: read-versions-unknown-kind, rule: errors, steps: [{method: GET, path: /v1/registry/versions/gadget/x}]}
- id: read-versions-after-publish
  rule: reads
  requires_sim: true
  steps:
    - {use: golden_published}
    - {method: GET, path: /v1/registry/versions/flow/disputa-cargo}
    - {method: GET, path: /v1/registry/versions/template/t/aviso_monto}
