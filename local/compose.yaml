name: pulso-local

services:
  postgres:
    image: docker.io/library/postgres@sha256:aa90e97ee862e558111d34cfb8b2c4bec768c2b039fb791341686928560263b3
    environment:
      POSTGRES_DB: ${PULSO_POSTGRES_DB:-pulso}
      POSTGRES_USER: ${PULSO_POSTGRES_USER:-pulso}
      POSTGRES_PASSWORD: ${PULSO_POSTGRES_PASSWORD:?set PULSO_POSTGRES_PASSWORD in a local ignored environment file}
    ports:
      - 127.0.0.1:${PULSO_POSTGRES_PORT:-54329}:5432
    volumes:
      - pulso-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [pulso-internal]

  localstack:
    image: docker.io/localstack/localstack@sha256:c2cdfe8c60db3b14ad0534a95d6c8e17b2a4b7befc7e293a3833e763a8bc6c65
    environment:
      SERVICES: s3
      EAGER_SERVICE_LOADING: "1"
      PERSISTENCE: "1"
    ports:
      - 127.0.0.1:${PULSO_LOCALSTACK_PORT:-4566}:4566
    volumes:
      - pulso-localstack:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [pulso-internal]

  # Development/demo observability only. Keep off the default engine stack.
  otel-lgtm:
    profiles: [observability]
    image: docker.io/grafana/otel-lgtm:0.33.1@sha256:d6c52678ab5b7144f27ae569fd778608121c0f4a10eb411983750a0d67c1fbe3
    ports:
      - "127.0.0.1:${PULSO_OTEL_GRAFANA_PORT:-3000}:3000"
      - "127.0.0.1:${PULSO_OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${PULSO_OTEL_HTTP_PORT:-4318}:4318"
    environment:
      PROMETHEUS_EXTRA_ARGS: "--storage.tsdb.retention.time=${PULSO_OTEL_METRICS_RETENTION:-24h}"
      LOKI_EXTRA_ARGS: "-store.retention=${PULSO_OTEL_LOGS_RETENTION:-24h} -compactor.retention-enabled=true -compactor.delete-request-store=filesystem"
      TEMPO_EXTRA_ARGS: "--compaction.block-retention=${PULSO_OTEL_TRACES_RETENTION:-24h}"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready && /otel-lgtm/docker/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m
    networks: [pulso-internal]

networks:
  pulso-internal:
    internal: true

volumes:
  pulso-postgres:
  pulso-localstack:
