[project]
name = "pulso-core-bridge"
version = "0.1.0"
description = "Pulso wire snapshot of the pinned agent-core, registry mock and parity suite (L1)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0.2,<7",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests", "../platform-sim/tests"]
pythonpath = [".", "../platform-sim"]
addopts = "-q --strict-markers"
markers = [
    "wire: L1a wire snapshot and golden vectors",
    "parity: registry-wire-contract (mock / a2 / real)",
]
