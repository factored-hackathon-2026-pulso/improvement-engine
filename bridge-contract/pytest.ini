[pytest]
testpaths = tests conformance
pythonpath = . ../core-bridge/src ../core-bridge/tests ../platform-sim ../platform-sim/tests
addopts = -q --strict-markers -p no:cacheprovider
markers =
    pg: needs real Postgres 16 (PULSO_TEST_PG_ADMIN)
    pending: covers a route marked x-status pending-implementation
