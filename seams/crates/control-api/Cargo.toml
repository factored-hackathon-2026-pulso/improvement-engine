[package]
name = "control-api"
description = "Claude-owned control-api LITE (artifacts, authorization-checks, core-task-bindings) over tiny_http; never depends on crates/core."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
core-client = { path = "../core-client" }
ed25519-dalek = "2"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
pg = { path = "../pg" }
postgres = "0.19"
tiny_http = "0.12"
