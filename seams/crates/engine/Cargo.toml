[package]
name = "engine"
description = "Run-once harness over a job store port: linear JobHandler list, CAS-persisted inputs, resume after kill. Live wiring (core-client, eval, authority) lives in `live` / `live_core`."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
abi = { path = "../abi" }
steps = { path = "../steps" }
core-client = { path = "../core-client" }
eval = { path = "../eval" }
authority = { path = "../authority" }
serde_json = "1"

[dev-dependencies]
# the FakeCore / GoldenCore bridge stubs of core-client/tests/common are reused by tests/real_core.rs
base64 = "0.22"
ed25519-dalek = "2"
