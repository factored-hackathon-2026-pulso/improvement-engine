# WRLD0 seeded base world declaration. A file next to the world directories (not inside one), so it changes no world
# files_digest, release id or expected state. Checked by tools/worldcheck.py. Category-neutral by design: it names no
# finding, category or winner; any dispute finding that fits the slots below may target them.
base_world: seeded
world: attention-demo
description: >-
  Pinned attention-demo dispute world used as the base for the improvement loop. The agent handles card-charge
  disputes; its closing reply is generated from one replaceable prompt, and its eval suite occupies the single suite slot.
agent:
  id: atencion
  version: 1.0.0
  purpose: customer dispute intake (charge not recognised, confirm, file, verify)
replaceable_prompt:
  id: p/resumen_radicado
  version: 1.0.0
  used_by: {flow: disputa-cargo, node: responder_ok}
eval_suite_slot:
  agent_id: atencion
  current: disputas-suite@1.0.0
  note: one suite per agent (assetcheck suite_count); Add EvalSuite publishes the next suite version into this slot
targetable_kinds: [replace_prompt, add_eval_suite]
authors:
  world: claude-wrld0
  suite: agent-core-registry-demo@c814c2b
  judge: claude-gsipy
