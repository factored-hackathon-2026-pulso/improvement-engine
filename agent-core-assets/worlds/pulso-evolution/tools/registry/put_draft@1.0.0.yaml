args_schema:
  additionalProperties: false
  properties:
    changes:
      items:
        additionalProperties: false
        properties:
          content:
            type: object
          docs:
            additionalProperties: false
            properties:
              changelog:
                type: string
              description:
                type: string
              rationale:
                type: string
            required:
            - description
            - rationale
            - changelog
            type: object
          kind:
            type: string
        required:
        - kind
        - content
        - docs
        type: object
      type: array
    expected_rev:
      type: integer
    proposal_id:
      type: string
  required:
  - proposal_id
  - expected_rev
  - changes
  type: object
confirmation_ttl: PT5M
