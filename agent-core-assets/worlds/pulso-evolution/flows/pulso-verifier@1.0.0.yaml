id: pulso-verifier
version: 1.0.0
priority: 50
nodes:
  - {id: bind, type: tool, config: {tool: pulso/bind_context@1, args: {}, save_as: binding},
     next: {ok: read_hypotheses, error: esc_binding, timeout: esc_binding, denied: esc_binding}}
  - {id: read_hypotheses, type: tool, config: {tool: pulso/artifact_get@1, args: {artifact_ref: slots.hypotheses_ref}, save_as: hypotheses},
     next: {ok: verify_hypotheses, error: esc_read, timeout: esc_read, denied: esc_read}}
  - id: verify_hypotheses
    type: agent
    config:
      tools_allowed: [pulso/lab_query@1, pulso/wiki_read@1, pulso/wiki_explore@1, pulso/wiki_transform@1]
      max_steps: 16
      prompt_ref: p/verifier_task@1
      goal: "Independently check every hypothesis in the input and return one verdict per hypothesis."
      save_as: pulso_verification
      input_view: [facts.hypotheses.value]
      output_schema:
        type: object
        additionalProperties: false
        required: [schema_version, verdicts]
        properties:
          schema_version: {type: string, enum: ["1"]}
          verdicts:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [hypothesis_id, verdict, evidence_refs]
              properties:
                hypothesis_id: {type: string}
                verdict: {type: string, enum: [supported, refuted, inconclusive]}
                evidence_refs: {type: array, items: {type: string}}
    next: {answered: done, gave_up: esc_gave_up}
  - {id: done, type: end, config: {outcome: completed}}
  - {id: esc_binding, type: escalate, config: {reason_code: auth_insufficient}}
  - {id: esc_read, type: escalate, config: {reason_code: tool_failure}}
  - {id: esc_gave_up, type: escalate, config: {reason_code: low_confidence}}
